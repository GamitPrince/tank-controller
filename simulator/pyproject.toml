[project]
name = "tanksim"
version = "0.0.0"
description = "Tank-AI Phase 1 simulator (ADR-0004 decision 13)"
requires-python = ">=3.10"
# Runtime dependencies. Upper bounds keep a major release from arriving
# unannounced; requirements-dev.txt pins the exact versions CI uses.
dependencies = [
  "cbor2>=5.6,<7",      # CBOR records (ADR-0004 decision 6)
  "PyYAML>=6.0.1,<7",   # the YAML signal list (ADR-0004 decision 9)
  "cddlparser>=0.6,<1", # parsing interfaces/records.cddl; see tanksim/cddl.py
]

[project.scripts]
# The one command the story asks for; `python -m tanksim` does the same.
tanksim = "tanksim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tanksim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tanksim"]

[tool.coverage.report]
# Only third-party and generated code is excluded. Our own code all counts.
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
