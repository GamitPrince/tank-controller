name: CI

# One workflow that ALWAYS runs on every pull request, so the single required
# check "ci-gate" always reports. (A path-filtered workflow that does not run
# leaves a required check "Expected" forever and blocks the merge.)
# Component jobs run only when their files change, which saves minutes.

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
      dashboard: ${{ steps.diff.outputs.dashboard }}
      simulator: ${{ steps.diff.outputs.simulator }}
      esp32: ${{ steps.diff.outputs.esp32 }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          # HEAD is the merge commit; its first parent is the base branch tip.
          files="$(git diff --name-only HEAD^1 HEAD)"
          echo "Changed files:"; echo "$files"
          has() { if echo "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          # A change to the contract, scripts or CI re-tests every component.
          shared="$(has '^(interfaces/|scripts/|\.github/)')"
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          if [ "$(has '^(firmware/|shared/)')" = true ] || [ "$shared" = true ]; then out firmware true; else out firmware false; fi
          if [ "$(has '^dashboard/')" = true ] || [ "$shared" = true ]; then out dashboard true; else out dashboard false; fi
          if [ "$(has '^(simulator/|firmware/)')" = true ] || [ "$shared" = true ]; then out simulator true; else out simulator false; fi
          # Both boards build the link library in shared/link-protocol/ (S-056).
          if [ "$(has '^(esp32/|shared/link-protocol/|firmware/\.clang-format)')" = true ] || [ "$shared" = true ]; then out esp32 true; else out esp32 false; fi
          if [ "$(has '^(docs/|[^/]*\.md$)')" = true ] || [ "$shared" = true ]; then out docs true; else out docs false; fi

  firmware:
    name: firmware
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # firmware/ci.sh fails without it in CI (S-057, ADR-0003 amendment 2).
      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q cppcheck
      # The west workspace that firmware/ci.sh fetches. The key hashes the
      # manifest that pins the Zephyr version and the pinned west version, and
      # there are no restore-keys, so a changed pin never reuses an older
      # tree (S-057, ADR-0003 amendment 3). west update still runs after a hit.
      - name: Cache the Zephyr tree
        uses: actions/cache@v6
        with:
          path: |
            .west
            zephyr
            modules
            bootloader
            tools
          key: zephyr-${{ runner.os }}-${{ hashFiles('firmware/west.yml', 'firmware/requirements-dev.txt') }}
      - run: bash scripts/ci/run-component.sh firmware

  dashboard:
    name: dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/run-component.sh dashboard

  simulator:
    name: simulator-test
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/run-component.sh simulator

  esp32:
    name: esp32
    needs: changes
    if: needs.changes.outputs.esp32 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/run-component.sh esp32

  docs:
    name: docs-links
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_links.py

  # The only CI check the ruleset requires. It fails if any job failed or was
  # cancelled; "skipped" is fine because the job's files did not change.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, firmware, dashboard, simulator, esp32, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Every job passed or was skipped
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs["changes"]["result"] != "success":
              sys.exit("The change-detection job did not succeed.")
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              sys.exit("Failed or cancelled jobs: " + json.dumps(bad))
          print("All required jobs passed:", json.dumps({k: v["result"] for k, v in needs.items()}))
          PY
