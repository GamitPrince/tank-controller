name: CI

# One workflow that ALWAYS runs on every pull request, so the single required
# check "ci-gate" always reports. (A path-filtered workflow that does not run
# leaves a required check "Expected" forever and blocks the merge.)
# Component jobs run only when their files change, which saves minutes.

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
      gateway: ${{ steps.diff.outputs.gateway }}
      dashboard: ${{ steps.diff.outputs.dashboard }}
      simulator: ${{ steps.diff.outputs.simulator }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          # HEAD is the merge commit; its first parent is the base branch tip.
          files="$(git diff --name-only HEAD^1 HEAD)"
          echo "Changed files:"; echo "$files"
          has() { if echo "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          # A change to the contract, scripts or CI re-tests every component.
          shared="$(has '^(interfaces/|scripts/|\.github/)')"
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          for c in firmware gateway dashboard; do
            if [ "$(has "^$c/")" = true ] || [ "$shared" = true ]; then out "$c" true; else out "$c" false; fi
          done
          if [ "$(has '^(simulator/|firmware/)')" = true ] || [ "$shared" = true ]; then out simulator true; else out simulator false; fi
          if [ "$(has '^(docs/|[^/]*\.md$)')" = true ] || [ "$shared" = true ]; then out docs true; else out docs false; fi

  firmware:
    name: firmware
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/run-component.sh firmware

  gateway:
    name: gateway
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/run-component.sh gateway

  dashboard:
    name: dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/run-component.sh dashboard

  simulator:
    name: simulator-test
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/run-component.sh simulator

  docs:
    name: docs-links
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_links.py

  # The only CI check the ruleset requires. It fails if any job failed or was
  # cancelled; "skipped" is fine because the job's files did not change.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, firmware, gateway, dashboard, simulator, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Every job passed or was skipped
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs["changes"]["result"] != "success":
              sys.exit("The change-detection job did not succeed.")
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              sys.exit("Failed or cancelled jobs: " + json.dumps(bad))
          print("All required jobs passed:", json.dumps({k: v["result"] for k, v in needs.items()}))
          PY
