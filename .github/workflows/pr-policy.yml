name: PR policy

# Enforces the Workflow Guide rules that a ruleset cannot express:
# story-first, naming, checklist, safety label, no forbidden files.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const head = pr.head.ref;
            const base = pr.base.ref;
            const body = pr.body || '';
            const labels = pr.labels.map(l => l.name);
            const errors = [];

            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const names = files.flatMap(f => f.previous_filename ? [f.filename, f.previous_filename] : [f.filename]);

            // 1. Title: type(scope): description
            const titleRe = /^(feat|fix|docs|style|refactor|test|chore|perf)\((firmware|gateway|dashboard|simulator|hardware|interfaces|docs)\)!?: \S.*$/;
            if (!titleRe.test(pr.title)) {
              errors.push('Title must look like "feat(firmware): add level control loop" (types: feat fix docs style refactor test chore perf; scopes: firmware gateway dashboard simulator hardware interfaces docs).');
            }

            // 2. Branch name and direction
            const storyRe = /^(feature|bugfix|hotfix)\/(S-\d{3,})-[a-z0-9][a-z0-9-]*$/;
            const releaseRe = /^release\/v\d+\.\d+\.\d+$/;
            const story = head.match(storyRe);
            const isRelease = releaseRe.test(head);
            if (!story && !isRelease) {
              errors.push(`Branch "${head}" is not allowed. Use feature/S-019-short-description, bugfix/S-031-..., hotfix/S-040-... or release/v0.1.0.`);
            }
            if (base === 'main' && story && story[1] !== 'hotfix') {
              errors.push('Only release/* and hotfix/* branches may target main. Feature and bugfix branches go into develop.');
            }

            // 3. Story-first: "Closes #N", and issue N is an open story/bug/chore whose title starts with the branch's story ID
            if (story) {
              const links = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => Number(m[1]));
              if (!links.length) {
                errors.push('No story linked. Add "Closes #<issue number>" to the description. No story card, no work.');
              } else {
                const idRe = new RegExp('^' + story[2] + '(?![0-9])', 'i');
                let ok = false; const why = [];
                for (const n of links) {
                  try {
                    const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
                    if (issue.pull_request) { why.push(`#${n} is a pull request, not a story card`); continue; }
                    if (issue.state !== 'open') { why.push(`#${n} is closed`); continue; }
                    if (!idRe.test(issue.title)) { why.push(`#${n} title "${issue.title}" does not start with ${story[2]}`); continue; }
                    if (!issue.labels.some(l => ['story', 'bug', 'chore'].includes(l.name))) { why.push(`#${n} has no story, bug or chore label`); continue; }
                    ok = true; break;
                  } catch (e) { why.push(`#${n} was not found`); }
                }
                if (!ok) errors.push(`The linked issue must be an open story card titled "${story[2]}: ..." with a story, bug or chore label. Problems: ${why.join('; ')}.`);
              }
            }

            // 4. Checklist: all items from the template present and ticked
            const unchecked = (body.match(/^\s*[-*] \[ \]/gm) || []).length;
            const checked = (body.match(/^\s*[-*] \[[xX]\]/gm) || []).length;
            if (unchecked > 0 || checked < 7) {
              errors.push(`Complete the PR checklist (${checked} ticked, ${unchecked} not ticked; all 7 template items must be ticked).`);
            }

            // 5. Safety paths need the safety label so reviewers and the EE can see it
            const touchesSafety = names.some(n => n.startsWith('firmware/src/safety/') || n.startsWith('docs/safety/'));
            if (touchesSafety && !labels.includes('safety')) {
              errors.push('This PR touches a safety path. Add the "safety" label; the EE must approve (enforced by CODEOWNERS).');
            }

            // 6. Release and hotfix PRs into main must update the CHANGELOG
            if (base === 'main' && !names.includes('CHANGELOG.md')) {
              errors.push('Release and hotfix PRs into main must update CHANGELOG.md.');
            }

            // 7. Nothing that must never be in the repo
            const forbidden = /(^|\/)(\.env|node_modules\/|__pycache__\/)|\.(elf|bin|hex|map|pem|key|p12)$|(^|\/)id_(rsa|ed25519)$/i;
            const added = files.filter(f => f.status !== 'removed' && forbidden.test(f.filename)).map(f => f.filename);
            if (added.length) {
              errors.push(`Forbidden files (secrets, build output): ${added.slice(0, 10).join(', ')}. Use GitHub Secrets, .env.example, and GitHub Releases for binaries.`);
            }

            // 8. Size: advisory only
            if (story && story[1] !== 'hotfix' && pr.additions + pr.deletions > 300) {
              core.warning(`This PR changes ${pr.additions + pr.deletions} lines. Aim for under about 300.`);
            }

            if (errors.length) core.setFailed(errors.map(e => '- ' + e).join('\n'));
            else core.info('PR policy passed.');
