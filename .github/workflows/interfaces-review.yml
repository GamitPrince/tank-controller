name: Interfaces review

# Rule: a change to interfaces/ needs review from one collaborator other than the author.
# Reports the commit status "interfaces-review", which the ruleset requires.
# The PR author cannot approve their own PR.
#
# Optional repository variable INTERFACE_REVIEWERS (comma-separated logins).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  evaluate-interfaces-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INTERFACE_REVIEWERS: ${{ vars.INTERFACE_REVIEWERS }}
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            if (!['develop', 'main'].includes(pr.base.ref)) return;

            const report = (state, description) => github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, state,
              context: 'interfaces-review', description: description.slice(0, 140),
            });

            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const touches = files.some(f => f.filename.startsWith('interfaces/') ||
              (f.previous_filename || '').startsWith('interfaces/'));
            if (!touches) return report('success', 'interfaces/ not changed');

            const allowed = (process.env.INTERFACE_REVIEWERS || '')
              .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);

            // Latest meaningful review per person.
            const reviews = await github.paginate(github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const latest = new Map();
            for (const r of reviews) {
              if (!['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) continue;
              latest.set(r.user.login.toLowerCase(), r);
            }
            const author = pr.user.login.toLowerCase();

            const approvers = [];
            for (const [login, r] of latest.entries()) {
              if (login === author) continue;
              if (r.state === 'APPROVED' && r.commit_id === pr.head.sha) {
                if (['OWNER', 'COLLABORATOR', 'MEMBER'].includes(r.author_association) ||
                    allowed.includes(login)) {
                  approvers.push(login);
                }
              }
            }

            if (approvers.length > 0) {
              return report('success', `Approved by ${approvers.join(', ')}`);
            }
            return report('failure', 'interfaces/ changed: needs one approval from a collaborator other than the author');