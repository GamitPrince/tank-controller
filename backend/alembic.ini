# Alembic configuration for the backend database (S-068). Run from backend/:
#   TANKAPI_DATABASE_URL="sqlite:///$TEMP/tankapi.db" .venv/Scripts/python.exe -m alembic upgrade head
# The URL is never written here; migrations/env.py reads it from the environment.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

