# ---------------------------------------------------------------------------
# Device health.
# ---------------------------------------------------------------------------
#
# [Confirm] This is a deliberate minimum, grounded in decisions already made.
# P1-02, P1-14 and P1-15 may add health signals in a later v1 revision; the
# change rule in interfaces/README.md allows adding ids without a v2.
#
# The per-reading quality flag and age in records.cddl already carry "this
# sensor failed" and "this value is stale" (ADR-0008), so no health signal
# duplicates them.
#
# Boot id and the "time not yet known" flag (ADR-0004 decision 11) are record
# header fields, not signals, because they describe the whole scan.

health:
  - id: 9001
    name: health_uptime
    description: Seconds since boot, the basis of boot-relative time.
    class: health
    unit: s
    scale: 1
    update_rate_ms: 60000
    read_only: true
    source:
      device: controller
    read_by_story: P1-15

  - id: 9002
    name: health_log_buffer_used
    description: >-
      Fill level of the append-only flash log used while the cloud is
      unreachable (ADR-0004 decision 12).
    class: health
    unit: percent
    scale: 0.1
    valid_range: [0.0, 100.0]
    update_rate_ms: 60000
    read_only: true
    source:
      device: controller
    read_by_story: P1-14

  - id: 9003
    name: health_cloud_link_up
    description: >-
      True while the cloud is acknowledging publishes within the configured
      window, about 10 s (ADR-0004 decision 8).
    class: health
    unit: bool
    scale: 1
    update_rate_ms: 60000
    read_only: true
    source:
      device: controller
    read_by_story: P1-14
