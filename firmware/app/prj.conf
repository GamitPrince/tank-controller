# The flash log (S-039) runs over Zephyr's flash API with CRC-16 framing.
CONFIG_FLASH=y
CONFIG_CRC=y
# The boot id is fresh random bytes each boot (S-038).
CONFIG_ENTROPY_GENERATOR=y
# The device ID is the MCU's factory unique ID (S-061).
CONFIG_HWINFO=y
# The FRDM-to-ESP32 link (S-048) is interrupt driven.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
